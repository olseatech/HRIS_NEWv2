<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<th:block th:replace="fragments/common::header-meta"></th:block>

    <!-- common import of css & js goes here -->
    <th:block th:replace="fragments/common::header-import-css"></th:block>
    <th:block th:replace="fragments/common::header-import-js"></th:block>
    
	<title>Human Resource Information System</title>


</head>

<body>

	<!-- Main Navbar -->
	<div th:replace="fragments/common::main-navbar"></div>
	<!-- /Main Navbar -->

					
	<!-- Page content -->
	<div class="page-content">	
		
		<!-- Main sidebar -->
		<div th:replace="fragments/common::main-sidebarnav"></div>
		<!-- /Main sidebar -->


		<!-- Main content -->
		<div class="content-wrapper">

			<!-- Page header -->
			<div class="page-header">
				<div class="page-header-content header-elements-md-inline">
					<div class="page-title d-flex">
						<h4><span class="font-weight-semibold">Position Title List</span></h4>
						<a href="#" class="header-elements-toggle text-default d-md-none"><i class="icon-more"></i></a>
					</div>					
				</div>
			</div>
			<!-- /page header -->
			
			
			<!-- Vertical form modal -->
			<div id="modal_form_vertical" class="modal fade" tabindex="-1" >
				<div class="modal-dialog">
					<div class="modal-content">
						<div class="modal-header bg-primary">
							<h5 class="modal-title">Position Details</h5>
							<button type="button" class="close" data-dismiss="modal">&times;</button>
						</div>
                        <!-- POST MAPPING CONTROLLER -->
						<form th:action="@{/save-position-title}" method="post" class="form-horizontal" th:object="${positionTitle}">
							<input type="hidden" th:field="*{id}" id="id"/>
							<div class="modal-body">
								<h3>Position Title Details</h3>
								<hr/>
								<div class="form-group row">									
									<label class="col-form-label col-sm-4">Position Title Name</label>
									<div class="col-sm-8">
										<span class="validationError text-danger" th:if="${#fields.hasErrors('positionTitleName')}" th:errors="*{positionTitleName}"></span>
										<input type="text" id="positionTitleName" th:field="*{positionTitleName}" placeholder="Position Title Name" class="form-control">
                                        
									</div>
								</div>

								<div class="form-group row">									
									<label class="col-form-label col-sm-4">Department Code</label>
									<div class="col-sm-8">
										<span class="validationError text-danger" th:if="${#fields.hasErrors('departmentCode')}" th:errors="*{departmentCode}"></span>
										<input type="text" id="departmentCode" th:field="*{departmentCode}" placeholder="Department Code" class="form-control">
									</div>
								</div>

								<div class="form-group row">									
									<label class="col-form-label col-sm-4">Employee Type</label>
									<div class="col-sm-8">
										<label><input type="radio" name="employment_status" value="PLANTILLA" onclick="filterEmployeeStatus() "> PLANTILLA</label><br/>
										<label><input type="radio" name="employment_status" value="NON-PLANTILLA" onclick="filterEmployeeStatus() "> NON-PLANTILLA</label>
									</div>
								</div>

								<div class="form-group row">									
									<label class="col-form-label col-sm-4">Employee Status</label>
									<div class="col-sm-8">
										<select class="form-control" id="employeeStatusSelect" name="employeeStatus" th:field="*{employeeStatusId}">
											<option value="" disabled selected>--Select option--</option>
    										<option th:each="employeeStatus : ${listOfEmployeeStatus}" th:value="${employeeStatus.id}" th:text="${employeeStatus.employeeStatusName}" th:data-row-type="${employeeStatus.employmentType}"></option>
										</select>
									</div>
								</div>

								<div class="form-group row">									
									<label class="col-form-label col-sm-4" >Level</label>
									<div class="col-sm-8" >
										<select class="form-control" id="levelSelect" name="level" th:field="*{levelId}">
											<option value="" disabled selected>--Select option--</option>
    										<option th:each="level : ${listOfLevel}" th:value="${level.id}" th:text="${level.levelName}"></option>
										</select>
									</div>
								</div>

								<div class="form-group row">									
									<label class="col-form-label col-sm-4">Salary Grade</label>
									<div class="col-sm-8">
										<select class="form-control" id="salaryGradeSelect" name="salaryGrade" th:field="*{salaryGradeId}">
											<option value="" disabled selected>--Select option--</option>
    										<option th:each="salaryGrade : ${listOfSalaryGrade}" th:value="${salaryGrade.id}" th:text="${salaryGrade.salaryGradeGroup}"></option>
										</select>
									</div>
								</div>
								<h3>Qualification Standard</h3>
								<hr/>
								<div class="form-group row">									
									<label class="col-form-label col-sm-4">Education</label>
									<div class="col-sm-8">
										<span class="validationError text-danger" th:if="${#fields.hasErrors('education')}" th:errors="*{education}"></span>
										<input type="text" id="education" th:field="*{education}" placeholder="Education" class="form-control">
                                        
									</div>
								</div>
								<div class="form-group row">									
									<label class="col-form-label col-sm-4">Training</label>
									<div class="col-sm-8">
										<span class="validationError text-danger" th:if="${#fields.hasErrors('training')}" th:errors="*{training}"></span>
										<input type="text" id="training" th:field="*{training}" placeholder="Training" class="form-control">
                                        
									</div>
								</div>
								<div class="form-group row">									
									<label class="col-form-label col-sm-4">Experience</label>
									<div class="col-sm-8">
										<span class="validationError text-danger" th:if="${#fields.hasErrors('experience')}" th:errors="*{experience}"></span>
										<input type="text" id="experience" th:field="*{experience}" placeholder="Experience" class="form-control">
									</div>
								</div>
								<div class="form-group row">									
									<label class="col-form-label col-sm-4">Eligibility</label>
									<div class="col-sm-8">
										<span class="validationError text-danger" th:if="${#fields.hasErrors('eligibility')}" th:errors="*{eligibility}"></span>
										<input type="text" id="eligibility" th:field="*{eligibility}" placeholder="Eligibility" class="form-control">
									</div>
								</div>
								
							</div>

							<div class="modal-footer">
								<button type="button" class=" btnClose btn btn-link" data-dismiss="modal">Close</button>
								<button type="submit" class="btn bg-primary">Submit</button>
							</div>
						</form>
					</div>
				</div>
			</div>
			<!-- /Vertical form modal -->

			<!-- Content area -->
			<div class="content pt-0">

				<!-- Dashboard content -->
				<div class="row">
					<div class="col-xl-12">
						<!-- Basic datatable -->
						<div class="card p-3">
							<div class="card-header header-elements-inline">
								<h5 class="card-title">Position Title List</h5>
								<div class="header-elements">
									<div class="list-icons">				                				
				                		<button type="button" class="btn btn-outline-primary" data-toggle="modal" data-target="#modal_form_vertical">Add Record</button>
				                	</div>
			                	</div>
							</div>
		
		
							<table class="table table-basic table-hover" id="table-list">
								<thead>
									<tr>
										<th>Position Title Name</th>
										<th>Employment Status</th>
                                        <th>Total Item Per Plantilla</th>	
										<th>Status</th>				
										<th class="text-center">Actions</th>
									</tr>
								</thead>
								<tbody>
									<th:block th:each="positionTitle : ${listOfPositionTitle}">
										<tr>
											<td id="positionTitleName" th:text="${positionTitle.getPositionTitleName()}"></td>
											<td id="employmentStatus" th:text="${positionTitle.getEmployeeStatus().getEmployeeStatusName()}"></td>
											<td id="payrollBehavior" th:text="${positionTitle.getEmployeeStatus().getPayrollBehavior()}"></td>
                                            <td id="positionTitleStatus" th:text="${positionTitle.isActive() ? 'Active' : 'Inactive'}">
											</td>

											<td class="text-center" width="250px;">
												<button id="editDegreeLevelButton" type="button" class="showDetails btn btn-primary"
                                                 th:data-row-positionTitleName="${positionTitle.getPositionTitleName()}"
												 th:data-row-departmentCode="${positionTitle.getDepartmentCode()}"
												 th:data-row-employmentStatus="${positionTitle.getEmployeeStatus().getId()}"
												 th:data-row-employmentType="${positionTitle.getEmployeeStatus().getEmploymentType()}"
												 th:data-row-level="${positionTitle.getLevel().getId()}"
												 th:data-row-salaryGrade="${positionTitle.getSalaryGrade().getId()}"
												 th:data-row-education="${positionTitle.getEducation()}"
												 th:data-row-training="${positionTitle.getTraining()}"
												 th:data-row-experience="${positionTitle.getExperience()}"
												 th:data-row-eligibility="${positionTitle.getEligibility()}"
                                                 th:data-row-id="${positionTitle.getId()}"
												data-toggle="modal" data-target="#modal_form_vertical"
                                                >View Record</button>
											</td>

										</tr>
									</th:block>							
								</tbody>
							</table>
						</div>
						<!-- /basic datatable -->					
					</div>
				</div>
				<!-- /dashboard content -->

			</div>
			<!-- /content area -->

			<!-- Footer -->
			<div th:replace="fragments/common::footer"></div>
			<!-- /Footer -->    

		</div>
		<!-- /main content -->

	</div>
	<!-- /page content -->

	<script th:inline="javascript">

		function filterEmployeeStatus() {
				$('#employeeStatusSelect').val("");
				var selectedType = $('input[name="employment_status"]:checked').val();
				
				$('#employeeStatusSelect option').each(function() {
					var rowType = $(this).data('row-type');
					
					if (selectedType === rowType || selectedType === undefined) {
						$(this).show();
					} else {
						$(this).hide();
					}
				});
			}
	
		$(document).ready(function() {
			//$(".nav-link").removeClass("active");
			//$("#academicHonorsNav").addClass("active");
			
			$(".nav-item-submenu").removeClass("nav-item-expanded nav-item-open");
			$("#systemSettingsNav").addClass("nav-item-expanded nav-item-open");
			$("#positionTitleNav").addClass("active");
			
			
			let msgCode = /*[[${uxmessage == null ? '' : uxmessage.code} ]]*/'';
			let msgDesc = /*[[${uxmessage == null ? '' : uxmessage.message}]]*/'';
			
			if(msgCode === 'ERROR'){
				$('#modal_form_vertical').modal('show');
				swal({
					title: "Error!",
					text: msgDesc,
					icon: "error",
					buttons: false,
		            timer: 2000,
				});
			} else if(msgCode === 'SUCCESS'){
				swal({
					title: "Success!",
					text: msgDesc,
					icon: "success",
					buttons: false,
		            timer: 2000,
				});
			}
			
			
		});
		
		$('#table-list').DataTable({
				"lengthMenu": [10, 25, 50],
				"ordering": false,                
		});
		
		$(document).on("click", ".showDetails", function() {
            var id = $(this).attr('data-row-id');
            var positionTitleName = $(this).attr('data-row-positionTitleName');
			var departmentCode = $(this).attr('data-row-departmentCode');
			var employmentStatus = $(this).attr('data-row-employmentStatus');
			var employmentType = $(this).attr('data-row-employmentType');
			var level = $(this).attr('data-row-level');
			var salaryGrade = $(this).attr('data-row-salaryGrade');
			var education = $(this).attr('data-row-education');
			var training = $(this).attr('data-row-training');
			var experience = $(this).attr('data-row-experience');
			var eligibility = $(this).attr('data-row-eligibility');

			$('input[name="employment_status"][value="' + employmentType + '"]').prop('checked', true);

            $("#modal_form_vertical").find("#id").val(id);
            $("#modal_form_vertical").find("#positionTitleName").val(positionTitleName);
			$("#modal_form_vertical").find("#departmentCode").val(departmentCode);
			$("#modal_form_vertical").find("#employeeStatusSelect").val(employmentStatus);
			$("#modal_form_vertical").find("#levelSelect").val(level);
			$("#modal_form_vertical").find("#salaryGradeSelect").val(salaryGrade);
			$("#modal_form_vertical").find("#education").val(education);
			$("#modal_form_vertical").find("#training").val(training);
			$("#modal_form_vertical").find("#experience").val(experience);
			$("#modal_form_vertical").find("#eligibility").val(eligibility);
			
        });
        $(document).on("click", ".close",".btnClose", function() {
            var id = $(this).attr('data-row-id');
            var positionTitleName = $(this).attr('data-row-positionTitleName');
			var departmentCode = $(this).attr('data-row-departmentCode');
			var employmentStatus = $(this).attr('data-row-employmentStatus');
			var employmentType = $(this).attr('data-row-employmentType');
			var level = $(this).attr('data-row-level');
			var salaryGrade = $(this).attr('data-row-salaryGrade');
			var education = $(this).attr('data-row-education');
			var training = $(this).attr('data-row-training');
			var experience = $(this).attr('data-row-experience');
			var eligibility = $(this).attr('data-row-eligibility');

			$('input[name="employment_status"]').prop('checked', false);

            $("#modal_form_vertical").find("#id").val("");
            $("#modal_form_vertical").find("#positionTitleName").val("");
			$("#modal_form_vertical").find("#departmentCode").val("");
			$("#modal_form_vertical").find("#employeeStatusSelect").val("");
			$("#modal_form_vertical").find("#levelSelect").val("");
			$("#modal_form_vertical").find("#salaryGradeSelect").val("");
			$("#modal_form_vertical").find("#education").val("");
			$("#modal_form_vertical").find("#training").val("");
			$("#modal_form_vertical").find("#experience").val("");
			$("#modal_form_vertical").find("#eligibility").val("");
        });
        $(document).on("click", ".btnClose", function() {
            var id = $(this).attr('data-row-id');
            var positionTitleName = $(this).attr('data-row-positionTitleName');
			var departmentCode = $(this).attr('data-row-departmentCode');
			var employmentStatus = $(this).attr('data-row-employmentStatus');
			var employmentType = $(this).attr('data-row-employmentType');
			var level = $(this).attr('data-row-level');
			var salaryGrade = $(this).attr('data-row-salaryGrade');
			var education = $(this).attr('data-row-education');
			var training = $(this).attr('data-row-training');
			var experience = $(this).attr('data-row-experience');
			var eligibility = $(this).attr('data-row-eligibility');

			$('input[name="employment_status"]').prop('checked', false);

            $("#modal_form_vertical").find("#id").val("");
            $("#modal_form_vertical").find("#positionTitleName").val("");
			$("#modal_form_vertical").find("#departmentCode").val("");
			$("#modal_form_vertical").find("#employeeStatusSelect").val("");
			$("#modal_form_vertical").find("#levelSelect").val("");
			$("#modal_form_vertical").find("#salaryGradeSelect").val("");
			$("#modal_form_vertical").find("#education").val("");
			$("#modal_form_vertical").find("#training").val("");
			$("#modal_form_vertical").find("#experience").val("");
			$("#modal_form_vertical").find("#eligibility").val("");
        });
	</script>
</body>
</html>
