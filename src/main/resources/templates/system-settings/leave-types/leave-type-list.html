<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <th:block th:replace="fragments/common::header-meta"></th:block>
    <th:block th:replace="fragments/common::header-import-css"></th:block>
    <th:block th:replace="fragments/common::header-import-js"></th:block>
    <title>Leave Types — HRIS</title>
</head>
<body>

<div th:replace="fragments/common::main-navbar"></div>

<div class="page-content">
    <div th:replace="fragments/common::main-sidebarnav"></div>

    <div class="content-wrapper">

        <!-- Page header -->
        <div class="page-header">
            <div class="page-header-content header-elements-md-inline">
                <div class="page-title d-flex">
                    <h4><span class="font-weight-semibold">Leave Types</span></h4>
                </div>
            </div>
        </div>

        <!-- ADD / EDIT MODAL -->
        <div id="modal_leave_type" class="modal fade" tabindex="-1">
            <div class="modal-dialog modal-lg">
                <div class="modal-content">
                    <div class="modal-header bg-primary">
                        <h5 class="modal-title">Leave Type Details</h5>
                        <button type="button" class="close" data-dismiss="modal">&times;</button>
                    </div>
                    <form th:action="@{/addLeaveType}" method="post" id="leaveTypeForm" th:object="${newLeaveType}">
                        <input type="hidden" th:field="*{id}" id="ltId"/>
                        <div class="modal-body">

                            <div class="form-group row">
                                <label class="col-form-label col-sm-3">Leave Code <span class="text-danger">*</span></label>
                                <div class="col-sm-9">
                                    <span class="text-danger" th:if="${#fields.hasErrors('leaveCode')}" th:errors="*{leaveCode}"></span>
                                    <input type="text" th:field="*{leaveCode}" id="ltLeaveCode" placeholder="e.g. VL, SL, FL" class="form-control text-uppercase" maxlength="20"/>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label class="col-form-label col-sm-3">Leave Name <span class="text-danger">*</span></label>
                                <div class="col-sm-9">
                                    <span class="text-danger" th:if="${#fields.hasErrors('leaveName')}" th:errors="*{leaveName}"></span>
                                    <input type="text" th:field="*{leaveName}" id="ltLeaveName" placeholder="e.g. Vacation Leave" class="form-control"/>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label class="col-form-label col-sm-3">Description</label>
                                <div class="col-sm-9">
                                    <textarea th:field="*{description}" id="ltDescription" class="form-control" rows="2" placeholder="Optional notes / legal basis"></textarea>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label class="col-form-label col-sm-3">Max Days / Year</label>
                                <div class="col-sm-3">
                                    <input type="number" step="0.5" min="0" th:field="*{maxDaysPerYear}" id="ltMaxDays" class="form-control" placeholder="0 = unlimited"/>
                                </div>
                                <label class="col-form-label col-sm-3">Accrual / Month</label>
                                <div class="col-sm-3">
                                    <input type="number" step="0.25" min="0" th:field="*{accrualPerMonth}" id="ltAccrual" class="form-control" placeholder="e.g. 1.25"/>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label class="col-form-label col-sm-3">Carry-Over Max</label>
                                <div class="col-sm-3">
                                    <input type="number" step="0.5" min="0" th:field="*{carryOverMax}" id="ltCarryOver" class="form-control" placeholder="0 = no carry-over"/>
                                </div>
                                <label class="col-form-label col-sm-3">Sort Order</label>
                                <div class="col-sm-3">
                                    <input type="number" min="0" th:field="*{sortOrder}" id="ltSortOrder" class="form-control"/>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label class="col-form-label col-sm-3">Eligible Employment Types</label>
                                <div class="col-sm-9">
                                    <input type="text" th:field="*{eligibleEmploymentTypes}" id="ltEligible" class="form-control"
                                           placeholder="PLANTILLA,NON-PLANTILLA — blank means all"/>
                                </div>
                            </div>

                            <div class="form-group row">
                                <div class="col-sm-3 offset-sm-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" th:field="*{commutable}" id="ltCommutable"/>
                                        <label class="form-check-label" for="ltCommutable">Commutable to Cash</label>
                                    </div>
                                </div>
                                <div class="col-sm-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" th:field="*{lwopType}" id="ltLwop"/>
                                        <label class="form-check-label" for="ltLwop">LWOP Type</label>
                                    </div>
                                </div>
                                <div class="col-sm-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" th:field="*{requiresMedCert}" id="ltMedCert"/>
                                        <label class="form-check-label" for="ltMedCert">Requires Med. Cert.</label>
                                    </div>
                                </div>
                            </div>

                            <!-- Extended Leave Policy -->
                            <div class="form-group row mt-2">
                                <label class="col-form-label col-sm-3 font-weight-bold text-primary">Extended Leave Policy</label>
                                <div class="col-sm-9">
                                    <small class="text-muted">CSC default: &gt;5 working days requires endorsement before approval.</small>
                                </div>
                            </div>

                            <div class="form-group row">
                                <label class="col-form-label col-sm-3">Threshold (days)</label>
                                <div class="col-sm-4">
                                    <input type="number" min="0" class="form-control"
                                           th:field="*{extendedLeaveDays}" id="ltExtDays"/>
                                    <small class="text-muted">0 = disabled (e.g. ML, PL, SPL)</small>
                                </div>
                            </div>

                            <div class="form-group row">
                                <div class="col-sm-9 offset-sm-3">
                                    <div class="form-check form-check-inline">
                                        <input type="checkbox" class="form-check-input"
                                               th:field="*{requiresDocForExtended}" id="ltReqDoc"/>
                                        <label class="form-check-label" for="ltReqDoc">Require document if extended</label>
                                    </div>
                                    <div class="form-check form-check-inline ml-3">
                                        <input type="checkbox" class="form-check-input"
                                               th:field="*{requiresEndorsementForExtended}" id="ltReqEndorse"/>
                                        <label class="form-check-label" for="ltReqEndorse">Require endorsement before approval if extended</label>
                                    </div>
                                </div>
                            </div>

                            <div class="form-group row">
                                <div class="col-sm-3 offset-sm-3">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" th:field="*{active}" id="ltActive"/>
                                        <label class="form-check-label" for="ltActive">Active</label>
                                    </div>
                                </div>
                            </div>

                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-link" data-dismiss="modal">Close</button>
                            <button type="submit" class="btn bg-primary">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        <!-- /modal -->

        <div class="content pt-0">
            <div class="row">
                <div class="col-xl-12">
                    <div class="card p-3">
                        <div class="card-header header-elements-inline">
                            <h5 class="card-title">Leave Type List</h5>
                            <div class="header-elements">
                                <button type="button" class="btn btn-outline-primary" id="btnAddLeaveType">Add Leave Type</button>
                            </div>
                        </div>

                        <table class="table table-basic table-hover" id="table-list">
                            <thead>
                            <tr>
                                <th>Code</th>
                                <th>Name</th>
                                <th class="text-center">Max Days/Yr</th>
                                <th class="text-center">Accrual/Mo</th>
                                <th class="text-center">Carry-Over</th>
                                <th class="text-center">LWOP</th>
                                <th class="text-center">Active</th>
                                <th class="text-center">Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="leaveTypeItem : ${leaveTypes}">
                                <td th:text="${leaveTypeItem.leaveCode}" class="font-weight-semibold"></td>
                                <td th:text="${leaveTypeItem.leaveName}"></td>
                                <td class="text-center" th:text="${leaveTypeItem.maxDaysPerYear == 0 ? '∞' : leaveTypeItem.maxDaysPerYear}"></td>
                                <td class="text-center" th:text="${leaveTypeItem.accrualPerMonth}"></td>
                                <td class="text-center" th:text="${leaveTypeItem.carryOverMax}"></td>
                                <td class="text-center">
                                    <span th:if="${leaveTypeItem.lwopType}" class="badge badge-warning">LWOP</span>
                                    <span th:unless="${leaveTypeItem.lwopType}">—</span>
                                </td>
                                <td class="text-center">
                                    <span th:if="${leaveTypeItem.active}" class="text-success"><i class="icon-checkmark3"></i></span>
                                    <span th:unless="${leaveTypeItem.active}" class="text-danger"><i class="icon-cross2"></i></span>
                                </td>
                                <td class="text-center">
                                    <button type="button" class="btn btn-sm btn-primary showLeaveType"
                                            th:data-id="${leaveTypeItem.id}"
                                            th:data-code="${leaveTypeItem.leaveCode}"
                                            th:data-name="${leaveTypeItem.leaveName}"
                                            th:data-desc="${leaveTypeItem.description}"
                                            th:data-maxdays="${leaveTypeItem.maxDaysPerYear}"
                                            th:data-accrual="${leaveTypeItem.accrualPerMonth}"
                                            th:data-carryover="${leaveTypeItem.carryOverMax}"
                                            th:data-sortorder="${leaveTypeItem.sortOrder}"
                                            th:data-eligible="${leaveTypeItem.eligibleEmploymentTypes}"
                                            th:data-commutable="${leaveTypeItem.commutable}"
                                            th:data-lwop="${leaveTypeItem.lwopType}"
                                            th:data-medcert="${leaveTypeItem.requiresMedCert}"
                                            th:data-active="${leaveTypeItem.active}"
                                            th:data-extdays="${leaveTypeItem.extendedLeaveDays}"
                                            th:data-reqdoc="${leaveTypeItem.requiresDocForExtended}"
                                            th:data-reqendorse="${leaveTypeItem.requiresEndorsementForExtended}"
                                            data-toggle="modal" data-target="#modal_leave_type">
                                        Edit
                                    </button>
                                    <a th:href="@{'/deleteLeaveType/' + ${leaveTypeItem.id}}"
                                       class="btn btn-sm btn-danger ml-1"
                                       onclick="return confirm('Delete this leave type?')">Delete</a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="fragments/common::footer"></div>
    </div>
</div>

<script th:inline="javascript">
    $(document).ready(function () {
        $(".nav-item-submenu").removeClass("nav-item-expanded nav-item-open");
        $("#systemSettingsNav").addClass("nav-item-expanded nav-item-open");
        $("#leaveTypesNav").addClass("active");

        let msgCode = /*[[${uxmessage == null ? '' : uxmessage.code}]]*/'';
        let msgDesc = /*[[${uxmessage == null ? '' : uxmessage.message}]]*/'';

        if (msgCode === 'ERROR') {
            $('#modal_leave_type').modal('show');
            swal({title: "Error!", text: msgDesc, icon: "error", buttons: false, timer: 2500});
        } else if (msgCode === 'SUCCESS') {
            swal({title: "Success!", text: msgDesc, icon: "success", buttons: false, timer: 2000});
        }

        $('#btnAddLeaveType').click(function () {
            clearForm();
            $('#leaveTypeForm').attr('action', '/addLeaveType');
            $('#modal_leave_type').modal('show');
        });

        $('#table-list').DataTable({lengthMenu: [10, 25, 50], ordering: false});

        $(document).on('click', '.showLeaveType', function () {
            const $btn = $(this);
            const formAction = $btn.attr('data-id') ? '/editLeaveType' : '/addLeaveType';
            $('#leaveTypeForm').attr('action', formAction);
            $('#ltId').val($btn.attr('data-id'));
            $('#ltLeaveCode').val($btn.attr('data-code'));
            $('#ltLeaveName').val($btn.attr('data-name'));
            $('#ltDescription').val($btn.attr('data-desc'));
            $('#ltMaxDays').val($btn.attr('data-maxdays'));
            $('#ltAccrual').val($btn.attr('data-accrual'));
            $('#ltCarryOver').val($btn.attr('data-carryover'));
            $('#ltSortOrder').val($btn.attr('data-sortorder'));
            $('#ltEligible').val($btn.attr('data-eligible'));
            $('#ltCommutable').prop('checked', $btn.attr('data-commutable') === 'true');
            $('#ltLwop').prop('checked', $btn.attr('data-lwop') === 'true');
            $('#ltMedCert').prop('checked', $btn.attr('data-medcert') === 'true');
            $('#ltActive').prop('checked', $btn.attr('data-active') === 'true');
            $('#ltExtDays').val($btn.attr('data-extdays') || '0');
            $('#ltReqDoc').prop('checked', $btn.attr('data-reqdoc') === 'true');
            $('#ltReqEndorse').prop('checked', $btn.attr('data-reqendorse') === 'true');
        });

        function clearForm() {
            $('#ltId').val('');
            $('#leaveTypeForm')[0].reset();
        }
    });
</script>
</body>
</html>
