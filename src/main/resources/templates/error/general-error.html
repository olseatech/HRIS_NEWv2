<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="fragments/common::header-meta"></th:block>
    <th:block th:replace="fragments/common::header-import-css"></th:block>
    <title>Error — HRIS</title>
</head>
<body>
<div th:replace="fragments/common::main-navbar"></div>
<div class="page-content">
    <div th:replace="fragments/common::main-sidebarnav"></div>
    <div class="content-wrapper">
        <div class="content d-flex justify-content-center align-items-center" style="min-height:60vh;">
            <div class="text-center" style="max-width:480px;">
                <i class="icon-warning22 text-warning" style="font-size:4rem;"></i>
                <h3 class="mt-3 font-weight-semibold" th:text="${errorTitle} ?: 'Page Error'">Page Error</h3>
                <p class="text-muted mt-2" th:text="${errorMessage} ?: 'An error occurred.'">An error occurred.</p>
                <small class="text-muted d-block mb-4" th:if="${requestUri != null}"
                       th:text="'Path: ' + ${requestUri}"></small>
                <a href="javascript:history.back()" class="btn btn-outline-secondary mr-2">
                    <i class="icon-arrow-left5 mr-1"></i> Go Back
                </a>
                <a th:href="@{/dashboard}" class="btn btn-primary">
                    <i class="icon-home4 mr-1"></i> Dashboard
                </a>
            </div>
        </div>
        <div th:replace="fragments/common::footer"></div>
    </div>
</div>
</body>
</html>
