<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
	<th:block th:replace="fragments/common::header-meta"></th:block>

    <!-- common import of css & js goes here -->
    <th:block th:replace="fragments/common::header-import-css"></th:block>
    <th:block th:replace="fragments/common::header-import-js"></th:block>
    
	<title>Human Resource Information System</title>


</head>

<body>

	<!-- Main Navbar -->
	<div th:replace="fragments/common::main-navbar"></div>
	<!-- /Main Navbar -->

					
	<!-- Page content -->
	<div class="page-content">	
		
		<!-- Main sidebar -->
		<div th:replace="fragments/common::main-sidebarnav"></div>
		<!-- /Main sidebar -->


		<!-- Main content -->
		<div class="content-wrapper">

			
			
			
			<!-- Vertical form modal -->
			<div id="modal_form_vertical" class="modal fade" tabindex="-1">
					<div class="modal-dialog modal-lg">
						<div class="modal-content">
							<div class="modal-header bg-primary">
								<h5 class="modal-title">Employee Information</h5>
								<button type="button" class="close" data-dismiss="modal">&times;</button>
							</div>

							<form id="addPatientForm" th:action="@{/save-employee}" method="post" th:object="${employee}" enctype="multipart/form-data">
								<input type="hidden" th:field="*{id}" name="id" id="id">
								<div class="modal-body">
									<div class="form-group">
										<div class="row">    
											<div class="col-sm-4">&nbsp;</div>
							                <div class="col-sm-4">
							                     <div class="card" th:object="${employee}">
													<div class="card card-body text-center">
														<div class="card-img-actions d-inline-block mb-3 ">									
															<img id="photoPreview" class="img-fluid rounded-circle card-img-top" th:src="|@{*{profilePhoto == null ? '/images/avatar.png' : profilePhoto}}|" width="150" height="150" alt="">
															<div class="card-img-actions-overlay card-img rounded-circle">
																<button type="button" id="fileSelect" class="btn btn-outline bg-white text-white border-white border-2 btn-icon rounded-round">
																	<i class="icon-camera"></i>
																</button>											
															</div>									
														</div>									
														<div>
														    <input type="file" name="photoFile" id="photoFile" accept="image/*" class="inputfile" />
														</div>
													</div>
												</div>
							                </div>
							                <div class="col-sm-4">&nbsp;</div>
							           </div>
									</div>
									<div class="form-group">
										<div class="row">
											<div class="col-sm-6">
							                        <label for="empNo">Employee No.</label>
							                        <span class="validationError text-danger" th:if="${#fields.hasErrors('empNo')}" th:errors="*{empNo}"></span>
							                        <input id="empNo" name="empNo" th:field="*{empNo}" placeholder="Employee No." type="text" class="form-control" >
							                    </div>
							                
							                
							                    <div class="col-sm-6">
							                        <label for="plantillaNo">Plantilla No.</label>
							                        <span class="validationError text-danger" th:if="${#fields.hasErrors('plantillaNo')}" th:errors="*{plantillaNo}"></span>
							                        <input id="plantillaNo" name="plantillaNo" th:field="*{plantillaNo}" placeholder="Plantilla No." type="text" class="form-control" >
							                    </div>
							            </div>
									</div>
									<div class="form-group">
										<div class="row">
											<div class="col-sm-6">
							                        <label for="firstName">First Name</label>
							                        <span class="validationError text-danger" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
							                        <input id="firstName" name="firstName" th:field="*{firstName}" placeholder="First Name" type="text" class="form-control" >
							                    </div>
							                
							                
							                    <div class="col-sm-6">
							                        <label for="lastName">Last Name</label>
							                        <span class="validationError text-danger" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
							                        <input id="lastName" name="lastName" th:field="*{lastName}" placeholder="Last Name" type="text" class="form-control" >
							                    </div>
							            </div>
									</div>
									
									<div class="form-group">
										<div class="row">
											<div class="col-sm-6">
							                        <label for="middleName">Middle Name</label>
							                        <input id="middleName" name="middleName" th:field="*{middleName}" placeholder="Middle Name" type="text" class="form-control" >
							                    </div>
							                
							                
							                    <div class="col-sm-6">
							                        <label for="civilStatus">Civil Status</label>
							                        <select class="form-control" name="civilStatus" id="civilStatus" th:field="*{civilStatus}">
														<option value="SINGLE">SINGLE</option>
														<option value="MARRIED">MARRIED</option>
														<option value="WIDOWED">WIDOWED</option>
														<option value="SEPARATED">SEPARATED</option>
													</select>
							                    </div>
							            </div>
									</div>
									
									<div class="form-group">
										<div class="row">       
							                    <div class="col-sm-6">
							                        <label for="gender">Gender</label>
							                        <select id="gender" name="gender" class="form-control" th:field="*{gender}">
							                            <option value="MALE" selected="selected">MALE</option>
							                            <option value="FEMALE">FEMALE</option>
							                        </select>
							                    </div>
							                    
							                
							                    <div class="col-sm-6">
							                        <label for="birthdate">Birthdate</label>
							                        <input type="date" class="form-control" id="birthdate" name="birthdate" th:field="*{birthdate}" placeholder="enter your birthday" title="enter your birthday" />
							                    </div>
							            </div>
									</div>

									<div class="form-group">
										<div class="row">    
							                    <div class="col-sm-6">
							                        <label for="mobileno1">Mobile</label>
							                        <input id="mobileno1" name="mobileno1" title="enter your mobile number if any." th:field="*{mobileno1}" placeholder="enter mobile number" type="text" class="form-control">
							                    </div>
							                    
							                    <div class="col-sm-6">
							                        <label for="email1">Email</label>
							                        <input id="email1" name="email1" title="enter your email." th:field="*{email1}" placeholder="Email Address" type="email" class="form-control" >
							                    </div>
							           </div>
									</div>
									
									<div class="form-group">
										<div class="row">    
							                    <div class="col-sm-6">
							                        <label for="pagibigNo">Pagibig No.</label>
							                        <input type="text" class="form-control" name="pagibigNo" th:field="*{pagibigNo}" id="pagibigNo" placeholder="Pagibig No." />
							                    </div>
							                    
							                    <div class="col-sm-6">
							                        <label for="philhealthNo">Philhealth No.</label>
							                        <input type="text" class="form-control" name="philhealthNo" id="philhealthNo" th:field="*{philhealthNo}" placeholder="Philhealth No." />
							                    </div>
							           </div>
									</div>
									
									<div class="form-group">
										<div class="row">    
							                    <div class="col-sm-6">
							                        <label for="gsisIdNo">GSIS ID No.</label>
							                        <input type="text" class="form-control" name="gsisIdNo" id="gsisIdNo" th:field="*{gsisIdNo}" placeholder="GSIS ID No." />
							                    </div>
							                    
							                    <div class="col-sm-6">
							                        <label for="tin">TIN</label>
							                        <input type="text" class="form-control" name="tin" id="tin" th:field="*{tin}" placeholder="TIN" />
							                    </div>
							           </div>
									</div>
									
									
									
									
								</div>

								<div class="modal-footer">
									<button type="button" class="btn btn-link" data-dismiss="modal">Close</button>
									<button type="submit" class="btn bg-primary">Save Info</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			<!-- /Vertical form modal -->

			<!-- Content area -->
			<div class="content pt-0">

				<!-- Dashboard content -->
				<div class="row mt-3">
					<div class="col-xl-12">
						
						
						<div class="card">
					<div class="card-header header-elements-inline">
						<h5 class="card-title">Clearance Application List</h5>
						<div class="header-elements">
							<div class="list-icons">				                				
				           		<button type="button" class="btn btn-outline-primary" data-toggle="modal" data-target="#modal_form_vertical">Add Record</button>
				           	</div>
						</div>
					</div>

					<div class="card-body">
						List of All Employee's Clearance Applications. Type to search desired employee.
					</div>

					<table class="table table-bordered table-hover datatable-highlight">
						<thead>
							<tr>
								<th>Employee Name</th>
								<th>Employee No.</th>
								<th>Date Submitted</th>
								<th>Division</th>
								<th>Status</th>
								<th class="text-center">Actions</th>
							</tr>
						</thead>
						<tbody>
							
							
							
						</tbody>
					</table>
				</div>
						
						
								
					</div>
				</div>
				<!-- /dashboard content -->

			</div>
			<!-- /content area -->

			<!-- Footer -->
			<div th:replace="fragments/common::footer"></div>
			<!-- /Footer -->    

		</div>
		<!-- /main content -->

	</div>
	<!-- /page content -->

	<script th:inline="javascript">
	
		$(document).ready(function() {
			//$(".nav-link").removeClass("active");
			//$("#academicHonorsNav").addClass("active");
			
			$(".nav-item-submenu").removeClass("nav-item-expanded nav-item-open");
			$("#employeeManagementNav").addClass("nav-item-expanded nav-item-open");
			$("#clearanceListNav").addClass("active");
			
			
			let msgCode = /*[[${uxmessage == null ? '' : uxmessage.code} ]]*/'';
			let msgDesc = /*[[${uxmessage == null ? '' : uxmessage.message}]]*/'';
			
			if(msgCode === 'ERROR'){
				$('#modal_form_vertical').modal('show');
				swal({
					title: "Error!",
					text: msgDesc,
					icon: "error",
					buttons: false,
		            timer: 2000,
				});
			} else if(msgCode === 'SUCCESS'){
				swal({
					title: "Success!",
					text: msgDesc,
					icon: "success",
					buttons: false,
		            timer: 2000,
				});
			}
			
			
		});
		
		$('#table-list').DataTable({});
		
		$(document).on("click", ".showDetails", function() {
            var id = $(this).attr('data-row-id');
            var firstName = $(this).attr('data-row-firstName');
			//var isActive = $(this).attr('data-row-isActive');
            
            // Check if id is not null or empty
            if (id && id.trim() !== "") {
                $("#activeField").removeClass("d-none");
            }
            
            $("#modal_form_vertical").find("#id").val(id);
			//$("#modal_form_vertical").find("#isActive").val(isActive);
            $("#modal_form_vertical").find("#firstName").val(firstName);
        });
        $(document).on("click", ".close",".btnClose", function() {
            var id = $(this).attr('data-row-id');
            var degreeName = $(this).attr('data-row-degreeName');
			

            $("#activeField").addClass("d-none");
            $("#modal_form_vertical").find("#id").val("");
            $("#modal_form_vertical").find("#firstName").val("");
        });
        $(document).on("click", ".btnClose", function() {
            var id = $(this).attr('data-row-id');
            var firstName = $(this).attr('data-row-firstName');

            $("#activeField").addClass("d-none");
            $("#modal_form_vertical").find("#id").val("");
            $("#modal_form_vertical").find("#firstName").val("");
        });
	</script>
</body>
</html>
