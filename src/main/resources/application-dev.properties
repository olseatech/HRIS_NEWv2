server.servlet.context-path=/hrisp
server.port=8084
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.location=${java.io.tmpdir}

file.upload-dir=${user.home}/hrisp-uploads

# Spring Data REST
spring.data.rest.base-path=/api
spring.data.rest.detection-strategy=annotated

# Spring security debug
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.authentication=DEBUG

# Spring security temporary username and password
#spring.security.user.name=user
#spring.security.user.password=$2y$11$6TP/e9ycvO4DwriSjfGip.6OVPNKuRArNyb4phwx9Kk3WPsdVjWUq

#SQL logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JPA and Hibernate
# spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true

# MySQL DataSource config
spring.datasource.url=jdbc:mysql://localhost:3306/hrisp_all
spring.datasource.username=root
spring.datasource.password=muning0328
# spring.datasource.password=Babonproduction52545254
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila

# Thymeleaf — disable template cache so changes apply without restart
spring.thymeleaf.cache=false

# Jackson — prevent serialization crashes on self-referencing / empty beans
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.fail-on-self-references=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# Hibernate OSIV — keep session open only for the controller, not the view layer
# Prevents accidental lazy-load during Thymeleaf rendering and makes hangs more obvious
spring.jpa.open-in-view=false

# Session — 30-minute idle timeout
server.servlet.session.timeout=1800

# Secure session cookie (set to true when behind HTTPS in production)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# -----------------------------------------------------------------------
# Mail — configure your SMTP server below (Gmail example shown)
# Replace with agency mail server credentials before deployment.
# -----------------------------------------------------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=hris-noreply@agency.gov.ph
spring.mail.password=CHANGE_ME
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Async thread pool for email sending
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=100

# File storage — directory for uploaded leave attachments (Windows-compatible)
file.upload-dir=${user.home}/hrisp-uploads/leave
